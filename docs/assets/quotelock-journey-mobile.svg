<svg xmlns="http://www.w3.org/2000/svg" width="640" height="656" viewBox="0 0 640 656" role="img" aria-labelledby="title desc">
  <title id="title">The QuoteLock journey</title>
  <desc id="desc">Quote a rules-priced bundle with immutable versions. Verify synthetic evidence and record reason-coded holds. Lock with bound identity, acceptance and gates. Track digital and physical states with an owned next action.</desc>
